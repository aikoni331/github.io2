<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Proxy</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px; background: #f4f4f4; border-bottom: 1px solid #ddd; display: flex; gap: 8px; }
  header input { flex: 1; padding: 8px; font-size: 14px; }
  header button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #status { padding: 4px 12px; font-size: 12px; color: #666; }
  #viewer { flex: 1; border: none; width: 100%; }
  #home { max-width: 600px; margin: 80px auto; padding: 0 20px; text-align: center; }
  #home input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
  #home button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<div id="home">
  <h1>簡易Webプロキシ</h1>
  <form id="startForm">
    <input type="text" id="startUrl" placeholder="https://example.com" required>
    <button type="submit">開く</button>
  </form>
  <p style="font-size:12px;color:#888;">※公開CORSプロキシ(allorigins.win)を経由します。ログインが必要なサイトやJS主体のサイトは正常に表示できない場合があります。</p>
</div>

<div id="browser" style="display:none; flex-direction:column; height:100vh;">
  <header>
    <input type="text" id="urlBar" placeholder="https://example.com">
    <button id="goBtn">移動</button>
  </header>
  <div id="status"></div>
  <iframe id="viewer"></iframe>
</div>

<script>
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

const homeEl = document.getElementById('home');
const browserEl = document.getElementById('browser');
const startForm = document.getElementById('startForm');
const startUrl = document.getElementById('startUrl');
const urlBar = document.getElementById('urlBar');
const goBtn = document.getElementById('goBtn');
const statusEl = document.getElementById('status');
const viewer = document.getElementById('viewer');

function normalizeUrl(u) {
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

async function loadUrl(targetUrl) {
  targetUrl = normalizeUrl(targetUrl);
  statusEl.textContent = '読み込み中: ' + targetUrl;
  urlBar.value = targetUrl;

  try {
    const res = await fetch(CORS_PROXY + encodeURIComponent(targetUrl));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let html = await res.text();

    // <base>タグを挿入して相対パス(画像・CSS等)を元サイト基準に解決させる
    if (!/<base[\s>]/i.test(html)) {
      html = html.replace(/<head[^>]*>/i, (m) => m + `<base href="${targetUrl}">`);
    }

    // ページ内リンククリックを親ページ経由の再読み込みに差し替える
    const script = `
      <script>
        document.addEventListener('click', function(e) {
          const a = e.target.closest('a[href]');
          if (!a) return;
          e.preventDefault();
          try {
            const abs = new URL(a.getAttribute('href'), document.baseURI).href;
            parent.postMessage({ type: 'navigate', url: abs }, '*');
          } catch (err) {}
        }, true);
      <\/script>
    `;
    html = html.replace(/<\/body>/i, script + '</body>');

    viewer.srcdoc = html;
    statusEl.textContent = '表示中: ' + targetUrl;
  } catch (err) {
    statusEl.textContent = '読み込み失敗: ' + err.message;
  }
}

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'navigate') {
    loadUrl(e.data.url);
  }
});

startForm.addEventListener('submit', (e) => {
  e.preventDefault();
  homeEl.style.display = 'none';
  browserEl.style.display = 'flex';
  loadUrl(startUrl.value);
});

goBtn.addEventListener('click', () => loadUrl(urlBar.value));
urlBar.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadUrl(urlBar.value);
});
</script>

</body>
</html>
